<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>заОкном</title>
    
    <!-- Автоопределение устройства и мгновенный редирект -->
    <script>
        function isMobile() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const width = window.innerWidth;

            return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet/i.test(ua) ||
                   (width <= 1024); // если ширина экрана ≤ 1024px — считаем мобильным/планшетом
        }

        // Сразу перенаправляем (выполняется ещё до загрузки страницы)
        if (isMobile()) {
            window.location.replace("mobile2.html");     // ← твоя мобильная версия
        } else {
            window.location.replace("desktop.html");     // ← твоя версия для ПК
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* Твой стиль оставляем как резерв (если вдруг JS отключён) */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #000 100%);
            z-index: -1;
        }
        .choice-container {
            text-align: center;
            padding: 24px;
            max-width: 520px;
            width: 100%;
        }
        /* ... весь остальной CSS ты можешь оставить без изменений ... */
    </style>
</head>
<body>
    <!-- Если JavaScript отключён или очень медленно грузится — покажем выбор -->
    <noscript>
        <div class="bg-gradient"></div>
        <div class="choice-container">
            <h1>заОкном</h1>
            <p class="subtitle">Выберите версию приложения</p>
            <div class="buttons-stack">
                <a href="mobile2.html" class="btn btn-mobile2">
                    <span class="icon">📱</span> Мобильная версия 2
                    <div class="small-hint">так же подходит для планшетов</div>
                </a>
                <a href="desktop.html" class="btn btn-desktop">
                    <span class="icon">💻</span> Версия для пк
                    <div class="small-hint">максимум информации</div>
                </a>
            </div>
        </div>
    </noscript>

    <!-- Если JS работает — пользователь даже не увидит эту страницу -->
</body>
</html>
